[package]
name = "polytool"
version = "0.9.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Per Alexandersson <per.w.alexandersson@gmail.com>"]
description = "Univariate polynomial toolkit: exact real-rootedness, interlacing, gamma-positivity, resultants, Ehrhart/h*-vectors, recurrence search, standard sequences"
readme = "README.md"
documentation = "https://github.com/PerAlexandersson/polytool/blob/main/doc/library.md"
repository = "https://github.com/PerAlexandersson/polytool"
keywords = ["polynomials", "real-rootedness", "interlacing", "combinatorics"]
categories = ["mathematics", "science"]
exclude = [
    "/.github/",
    "/AGENTS.md",
    "/bench-results/",
    "/scripts/",
]

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

# Index loops over matrix and digraph entries are the clearest form here.
[lints.clippy]
needless_range_loop = "allow"

[features]
# Catalog sweeps, workload fingerprints and expensive regression checks.
full-tests = []
# Thread-local rational-fallback testing in the shared arithmetic engine.
test-hooks = ["exact-algebra/test-hooks"]

[dependencies]
exact-algebra = { version = "0.1.0", path = "crates/exact-algebra" }
exact-stability = { version = "0.1.0", path = "crates/exact-stability" }
# clap 4.6 needs Rust 1.85; the library keeps rust-version 1.82.
clap = { version = "~4.5.40", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
clap_complete = "~4.5.40"
exact-real-roots = { version = "0.2.0", path = "crates/exact-real-roots" }
ore-algebra = { version = "0.1.0", path = "crates/ore-algebra" }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
