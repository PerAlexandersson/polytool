[package]
name = "polytool-web"
version = "0.6.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "WebAssembly interface for polytool"
repository = "https://github.com/PerAlexandersson/polytool"
publish = false

[lib]
crate-type = ["cdylib"]

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[dependencies]
polytool = { path = ".." }
num-bigint = "0.4"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
