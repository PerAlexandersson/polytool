[package]
name = "polytool-web"
version = "0.2.1-rc.5"
edition = "2021"
description = "WebAssembly interface for polytool"

[lib]
crate-type = ["cdylib"]

[dependencies]
polytool = { path = ".." }
num-bigint = "0.4"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
