[package]
name = "polytool-mcp"
version = "0.2.1-rc.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Per Alexandersson <per.w.alexandersson@gmail.com>"]
description = "Model Context Protocol server for polytool"
readme = "README.md"
repository = "https://github.com/PerAlexandersson/polytool"
publish = false

[[bin]]
name = "polytool-mcp"
path = "src/main.rs"

[dependencies]
polytool = { path = ".." }
num-bigint = "0.4"
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
