[package]
name = "polytool-mcp"
version = "0.6.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
authors = ["Per Alexandersson <per.w.alexandersson@gmail.com>"]
description = "Model Context Protocol server for polytool"
readme = "README.md"
repository = "https://github.com/PerAlexandersson/polytool"
publish = false

[[bin]]
name = "polytool-mcp"
path = "src/main.rs"

# `missing_docs` is deliberately absent: the request and response types derive
# `JsonSchema`, so their doc comments become the published tool schemas.
[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[dependencies]
polytool = { path = ".." }
num-bigint = "0.4"
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
