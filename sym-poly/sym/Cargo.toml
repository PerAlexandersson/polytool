[package]
name = "sym-poly-sym"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generic symmetric functions in six classical bases, tableaux, characters, chromatic functions, LLT, and Macdonald computations"
readme = "README.md"
publish = false

[dependencies]
combinatoric-core = { path = "../../combinatoric-core" }
sym-poly-core = { path = "../core" }
sym-poly-multipoly = { path = "../multipoly" }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
num-integer = "0.1"
