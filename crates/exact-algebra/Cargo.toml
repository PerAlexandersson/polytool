[package]
name = "exact-algebra"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Exact integer and rational linear algebra, modular arithmetic and certified reconstruction"
readme = "README.md"
repository = "https://github.com/PerAlexandersson/polytool"
keywords = ["linear-algebra", "exact-arithmetic", "modular", "reconstruction"]
categories = ["mathematics", "science"]
publish = false

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[features]
test-hooks = []

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
