name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # build.rs generates the catalog from data/oeis-catalog.jsonl and rejects
      # malformed records; these tests check that the data file is canonical
      # (sorted, one record per line, stable key order), that provenance is
      # consistent, and that existing entries keep their recorded fingerprints.
      - name: Check OEIS catalog data
        run: cargo test --lib oeis::tests

      - name: Check lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      # A full `cargo package` of polytool resolves `exact-real-roots` from
      # crates.io, where it is not published yet; until it is, check the
      # polytool file list and package the path dependency on its own.
      - name: Verify package
        run: |
          cargo package --list | grep -x 'data/oeis-catalog.jsonl' > /dev/null
          cargo package --manifest-path crates/exact-real-roots/Cargo.toml

  companions:
    name: Companion packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check MCP formatting
        run: cargo fmt --manifest-path mcp/Cargo.toml --all -- --check

      - name: Check MCP lints
        run: cargo clippy --manifest-path mcp/Cargo.toml --all-targets -- -D warnings

      - name: Run MCP tests
        run: cargo test --manifest-path mcp/Cargo.toml --all-targets

      - name: Check web package
        run: cargo check --manifest-path web/Cargo.toml
