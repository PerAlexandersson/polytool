name: Rust workspace

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Validate locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Check maintained workspace formatting
        run: cargo fmt --all -- --check
      - name: Build workspace documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  maintained-crates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - polytool
          - polytool-mcp
          - polytool-web
          - combinatoric-core
          - combpoly
          - sym-poly-core
          - sym-poly-multipoly
          - sym-poly-sym
          - sym-poly-qsym
          - flagged-lorentzian
          - polynomial-lab
          - polynomial-lab-mcp
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test ${{ matrix.package }}
        run: cargo test --locked -p "${{ matrix.package }}" --all-targets

  declared-msrv:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: polytool
            toolchain: "1.82"
          - package: polytool-web
            toolchain: "1.82"
          - package: polytool-mcp
            toolchain: "1.88"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Check ${{ matrix.package }} on Rust ${{ matrix.toolchain }}
        run: cargo check --locked -p "${{ matrix.package }}"

  tracked-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # A few frozen GT experiments still consume the retired Kostka
          # submodule for reproducibility. No maintained job checks it.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments -> target
      - name: Test tracked experiment artifacts
        run: cargo test --locked --manifest-path experiments/Cargo.toml --all-targets
