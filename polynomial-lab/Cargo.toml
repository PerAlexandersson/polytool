[package]
name = "polynomial-lab"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Per Alexandersson <per.w.alexandersson@gmail.com>"]
description = "Structured project data tools for polynomial real-rootedness and interlacing labs"
readme = "README.md"
publish = false

[[bin]]
name = "poly-lab"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
num-bigint = "0.4"
num-traits = "0.2"
polytool = { path = "../polytool" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1"
