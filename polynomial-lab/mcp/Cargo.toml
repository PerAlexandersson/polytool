[package]
name = "polynomial-lab-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Per Alexandersson <per.w.alexandersson@gmail.com>"]
description = "Model Context Protocol server for polynomial-lab"
readme = "README.md"
publish = false

[[bin]]
name = "poly-lab-mcp"
path = "src/main.rs"

[dependencies]
polynomial-lab = { path = ".." }
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
